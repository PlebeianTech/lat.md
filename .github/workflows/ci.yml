name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      # Rust toolchain for the @lat.md/embed candle → WASM engine.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/embed/crate

      # Cache the ~90 MB MiniLM weights fetched + converted by build-weights.mjs
      # (the script is idempotent and skips the fetch when model/ is present), so
      # CI doesn't re-download from HuggingFace every run. Keyed on the fetch
      # script so a change to the weights source busts the cache.
      - name: Cache MiniLM weights
        uses: actions/cache@v6
        with:
          path: packages/embed-minilm-fp16/model
          key: minilm-weights-${{ matrix.os }}-${{ hashFiles('packages/embed-minilm-fp16/scripts/build-weights.mjs') }}

      - run: pnpm install --frozen-lockfile

      # Deliberately not a `@lat:` pointer: walk.ts excludes every path
      # starting with `.`, so nothing under .github/ is ever scanned and a
      # ref here would rot silently. Rationale lives in lat.md/fork.md
      # under "The upstream guard".
      - name: Upstream guard
        run: pnpm exec tsx src/fork/upstream-guard-cli.ts --fetch

      # buildall = packages (WASM engine + fp16 weights + tsc) then top-level lat.
      - run: pnpm buildall
      - run: pnpm vitest run --reporter=verbose

      # Validate lat.md/ with the binary this commit just built, not with a
      # published one. The fork's index entries are Markdown links where
      # upstream's are wiki links, so upstream's `lat` reports every index file
      # as malformed. Only this tree's own CLI is a valid checker for this tree.
      - run: node dist/src/cli/index.js check

      # Prove the tarball is installable before a tag exists, not after it is
      # on npm. `pnpm pack` rewrites every `workspace:*` to a bare version, so
      # a workspace package upstream has not published turns into a dependency
      # that 404s for every user while resolving fine in this tree — which is
      # exactly how 0.12.3-fork.14 shipped broken. The --prefix has to be
      # outside the repo or npm finds the workspace links and proves nothing.
      - name: Install the packed tarball and run it
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          npm install --prefix "$RUNNER_TEMP/smoke" --no-audit --no-fund "$RUNNER_TEMP"/pack/*.tgz
          "$RUNNER_TEMP/smoke/node_modules/.bin/lat" --version
          # The view server is the only importer of the vendored Express
          # runtime, and nothing else in the CLI would notice it missing.
          node --input-type=module -e "
            await import('$RUNNER_TEMP/smoke/node_modules/@plebeiantech/lat.md/dist/src/view/server.js');
            console.log('view server module loads');
          "
