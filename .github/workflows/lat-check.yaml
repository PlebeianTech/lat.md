name: lat check
on: [push, pull_request]

permissions:
  contents: read

jobs:
  lat-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Upstream now builds its own CLI here, which ci.yml already does for
      # this tree. Kept diverged because this job earns its place a different
      # way: it installs the *published* package and runs it against a real
      # repository, which no source build can do. Rationale: lat.md/fork.md.
      #
      # It must be the fork's package. Upstream's index parser matches only
      # `- [[name]]`; this fork writes `- [Label](dest.md)` and reads both, so
      # upstream's build sees zero entries here and calls every index file
      # incomplete.
      - run: npm install -g @plebeiantech/lat.md
      - run: lat check
