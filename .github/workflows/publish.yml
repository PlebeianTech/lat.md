name: Release

# Attaches a packed tarball to a GitHub Release, then publishes
# @plebeiantech/lat.md to npm when an NPM_TOKEN secret is set. It never
# publishes under the name `lat.md`, which is upstream's; the scoped name makes
# a fork build impossible to confuse with theirs. Rationale, and why upstream's
# version of this file was replaced wholesale, live in lat.md/dev-process.md
# under "Publishing".
#
# Deliberately not a `@lat:` pointer: .github/ is a dotfile directory and the
# code-ref scanner never walks it, so the ref could rot without lat check ever
# noticing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Trusted Publishing (OIDC): npm mints a short-lived credential from this
      # token, so no long-lived NPM_TOKEN has to exist. Also what --provenance
      # signs with.
      id-token: write
    steps:
      # fetch-depth: 0 because the release notes are derived from the commit
      # range since the previous tag, which a shallow clone cannot see.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      # Trusted Publishing needs npm >= 11.5.1; the bundled npm is older.
      - run: npm install -g npm@latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - run: pnpm install --frozen-lockfile
      - run: pnpm buildall
      - run: pnpm vitest run --reporter=verbose

      - name: Verify the package name, version, and tag
        run: |
          NAME=$(node -p "require('./package.json').name")
          if [ "$NAME" != "@plebeiantech/lat.md" ]; then
            echo "Refusing to publish as '$NAME'. The fork publishes only @plebeiantech/lat.md; 'lat.md' is upstream's package." >&2
            exit 1
          fi
          VER=$(node -p "require('./package.json').version")
          case "$VER" in
            *-fork.*) ;;
            *) echo "Refusing to release $VER: not a -fork version." >&2; exit 1 ;;
          esac
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "v$VER" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match package.json version v$VER." >&2
              exit 1
            fi
          else
            # workflow_dispatch: no tag in the ref, so v$VER is fetched instead.
            # Deliberately not --depth=1. A shallow fetch writes .git/shallow
            # and grafts history at the fetched commit, which is HEAD here — so
            # every `git describe` in the notes step below dies with "Not a
            # valid object name" and the release ships with no commit range and
            # no diff link. `fetch-depth: 0` above already paid for the history.
            git fetch --no-tags origin "refs/tags/v$VER:refs/tags/v$VER" 2>/dev/null || true
            if TAGGED=$(git rev-parse -q --verify "refs/tags/v$VER^{commit}" 2>/dev/null); then
              if [ "$TAGGED" != "$(git rev-parse HEAD)" ]; then
                echo "Tag v$VER points at $TAGGED, but this run is building $(git rev-parse HEAD)." >&2
                exit 1
              fi
            fi
          fi
          # Per-release dist-tag: 0.12.3-fork.2 -> fork-2, tail digits only.
          FORKN="${VER##*-fork.}"
          case "$FORKN" in
            ''|*[!0-9]*)
              echo "Refusing to release $VER: the -fork. suffix must be a number, not '$FORKN'." >&2
              exit 1 ;;
          esac
          FORKTAG="fork-$FORKN"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "TGZ=plebeiantech-lat.md-$VER.tgz" >> "$GITHUB_ENV"
          echo "FORKTAG=$FORKTAG" >> "$GITHUB_ENV"

      - name: Pack the CLI
        run: |
          mkdir -p release
          pnpm pack --pack-destination release
          # A second copy under a version-free name, so
          # /releases/latest/download/lat.md-latest.tgz is a URL that never
          # needs editing. GitHub's `latest` redirect resolves the release but
          # not the asset name, so a stable name has to exist as a real asset.
          cp "release/${TGZ}" release/lat.md-latest.tgz
          ls -l release

      # Prose when someone wrote it, the commit range when nobody did. A
      # release must never be blocked on notes, and notes must never be a
      # file someone forgot to update — so the fallback is derived, not typed.
      - name: Write the release notes
        run: |
          NOTES_FILE=".github/release-notes/v${VER}.md"
          # --match pins this to the fork's own tag line. Upstream's v0.12.x
          # tags are not on origin today, so a fresh clone cannot see them —
          # but `git fetch upstream` brings them into any local checkout, and
          # one `git push --tags` would put them where this runs. --first-parent
          # keeps a merged side branch from supplying a nearer tag.
          #
          # HEAD^ is the fallback for a workflow_dispatch run made before the
          # tag exists, which the version check above explicitly allows; without
          # it those notes claim "First release of the fork".
          PREV=$(git describe --first-parent --tags --abbrev=0 --match 'v*-fork.*' "v${VER}^" 2>/dev/null \
            || git describe --first-parent --tags --abbrev=0 --match 'v*-fork.*' HEAD^ 2>/dev/null \
            || true)
          # $GITHUB_SHA rather than HEAD: this string ends up in a compare URL
          # that outlives the run, and HEAD there resolves to whatever the
          # default branch tip happens to be when someone clicks it.
          RANGE_END="v${VER}"
          git rev-parse -q --verify "refs/tags/v${VER}^{commit}" >/dev/null 2>&1 || RANGE_END="${GITHUB_SHA}"
          {
            if [ -f "$NOTES_FILE" ]; then
              cat "$NOTES_FILE"
            else
              echo "## What changed"
              echo
              if [ -n "$PREV" ]; then
                git log --no-merges --pretty='- %s' "${PREV}..${RANGE_END}" \
                  | grep -v '^- Bump to ' || echo "- No commits since ${PREV}."
              else
                echo "- First release of the fork."
              fi
            fi
            echo
            if [ -n "$PREV" ]; then
              echo "[Full diff](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${RANGE_END})"
              echo
            fi
            echo "---"
            echo
            echo "Fork build of lat.md."
            echo
            echo "Install the CLI:"
            echo
            echo '```'
            echo "npm i -g --prefix ~/.local/lat https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/lat.md-latest.tgz"
            echo '```'
            echo
            echo "Then put ~/.local/lat/bin on PATH. To pin this exact version instead:"
            echo
            echo '```'
            echo "npm i -g --prefix ~/.local/lat https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VER}/${TGZ}"
            echo '```'
            echo
            echo "Or through mise:"
            echo
            echo '```'
            echo "mise settings add minimum_release_age_excludes npm:@plebeiantech/lat.md"
            echo "mise use -g npm:@plebeiantech/lat.md@latest"
            echo '```'
            echo
            echo "Install the Claude Code plugin (no build needed):"
            echo
            echo '```'
            echo "/plugin marketplace add ${GITHUB_REPOSITORY}"
            echo "/plugin install lat-md@lat-md"
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" release/*.tgz --clobber
            gh release edit "v$VER" --notes-file release-notes.md
          else
            # --target pins the tag to the commit this run built, tested and
            # packed. Without it gh creates the tag at the default branch tip,
            # which on a workflow_dispatch run made before the tag exists is
            # whatever landed on main since — a tag that disagrees with its own
            # artifact, and a name too taken to push the real one over.
            gh release create "v$VER" release/*.tgz \
              --target "$GITHUB_SHA" \
              --title "v$VER" \
              --notes-file release-notes.md
          fi

      # Last on purpose: the GitHub Release is the artifact that needs no
      # registry, so a bad token or a registry outage must not prevent it.
      # Gated on the secret; a missing token skips rather than fails.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Two ways to authenticate. Trusted Publishing needs no secret and
          # is preferred; ACTIONS_ID_TOKEN_REQUEST_URL is present whenever
          # id-token: write is granted. A classic NPM_TOKEN still works, but a
          # non-automation token fails with EOTP because publishing asks for a
          # one-time password that CI cannot supply.
          if [ -z "${NODE_AUTH_TOKEN:-}" ] && [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "No NPM_TOKEN and no OIDC credential — skipping the npm publish."
            exit 0
          fi
          if npm view "@plebeiantech/lat.md@$VER" version >/dev/null 2>&1; then
            echo "@plebeiantech/lat.md@$VER is already published, skipping."
            exit 0
          fi
          # A dist-tag is required, not cosmetic: every fork release is a
          # semver prerelease (the -fork.N suffix), and npm refuses to publish
          # one without an explicit --tag rather than silently moving `latest`.
          #
          # It has to be `latest`. Trusted Publishing mints a PUBLISH-SCOPED
          # credential, so the tag set here is the only one CI can ever apply —
          # a follow-up `npm dist-tag add` is answered with 401. Publishing
          # under fork-N instead would strand `latest` on whichever build went
          # out first, and `mise use -g npm:@plebeiantech/lat.md@latest`
          # resolves through that tag.
          npm publish "./release/${TGZ}" --provenance --access public --tag latest

          # The per-release fork-N tag is a convenience, not load-bearing:
          # pinning works by exact version regardless. It needs dist-tag
          # permission, which OIDC does not grant, so this is best-effort and
          # never fails the release.
          if npm dist-tag add "@plebeiantech/lat.md@$VER" "$FORKTAG" 2>/dev/null; then
            echo "Tagged $VER as $FORKTAG."
          else
            echo "Could not add the $FORKTAG tag — Trusted Publishing credentials are publish-scoped. Pin by exact version instead: @plebeiantech/lat.md@$VER"
          fi
