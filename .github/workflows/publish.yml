name: Release

# The fork publishes to no registry: it attaches a packed tarball to a GitHub
# Release, then publishes @plebeiantech/lat.md to npm if an NPM_TOKEN secret
# is set. The package name is scoped so a fork build can never be
# confused with upstream's `lat.md`. Rationale, and why upstream's version of
# this file was replaced wholesale, live in lat.md/dev-process.md under
# "Publishing".
#
# Deliberately not a `@lat:` pointer: .github/ is a dotfile directory and the
# code-ref scanner never walks it, so the ref could rot without lat check ever
# noticing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - run: pnpm install --frozen-lockfile
      - run: pnpm buildall
      - run: pnpm vitest run --reporter=verbose

      - name: Verify the package name, version, and tag
        run: |
          NAME=$(node -p "require('./package.json').name")
          if [ "$NAME" != "@plebeiantech/lat.md" ]; then
            echo "Refusing to publish as '$NAME'. The fork publishes only @plebeiantech/lat.md; 'lat.md' is upstream's package." >&2
            exit 1
          fi
          VER=$(node -p "require('./package.json').version")
          case "$VER" in
            *-fork.*) ;;
            *) echo "Refusing to release $VER: not a -fork version." >&2; exit 1 ;;
          esac
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$VER" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v$VER." >&2
            exit 1
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "TGZ=plebeiantech-lat.md-$VER.tgz" >> "$GITHUB_ENV"

      - name: Pack the CLI
        run: |
          mkdir -p release
          pnpm pack --pack-destination release
          # A second copy under a version-free name, so
          # /releases/latest/download/lat.md-latest.tgz is a URL that never
          # needs editing. GitHub's `latest` redirect resolves the release but
          # not the asset name, so a stable name has to exist as a real asset.
          cp "release/${TGZ}" release/lat.md-latest.tgz
          ls -l release

      - name: Write the release notes
        run: |
          {
            echo "Fork build of lat.md."
            echo
            echo "Install the CLI:"
            echo
            echo '```'
            echo "npm i -g --prefix ~/.local/lat https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/lat.md-latest.tgz"
            echo '```'
            echo
            echo "Then put ~/.local/lat/bin on PATH. To pin this exact version instead:"
            echo
            echo '```'
            echo "npm i -g --prefix ~/.local/lat https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VER}/${TGZ}"
            echo '```'
            echo
            echo "Install the Claude Code plugin (no build needed):"
            echo
            echo '```'
            echo "/plugin marketplace add ${GITHUB_REPOSITORY}"
            echo "/plugin install lat-md@lat-md"
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" release/*.tgz --clobber
          else
            gh release create "v$VER" release/*.tgz \
              --title "v$VER" \
              --notes-file release-notes.md
          fi

      # Last on purpose: the GitHub Release is the artifact that needs no
      # registry, so a bad token or a registry outage must not prevent it.
      # Gated on the secret; a missing token skips rather than fails.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN not set — skipping the npm publish."
            exit 0
          fi
          if npm view "@plebeiantech/lat.md@$VER" version >/dev/null 2>&1; then
            echo "@plebeiantech/lat.md@$VER is already published, skipping."
            exit 0
          fi
          npm publish "./release/${TGZ}" --access public
