name: Release

# This fork publishes to no registry; it attaches a packed tarball to a GitHub
# Release. Rationale, and why upstream's npm-publishing version of this file was
# replaced wholesale, live in lat.md/dev-process.md under "Publishing".
#
# Deliberately not a `@lat:` pointer: .github/ is a dotfile directory and the
# code-ref scanner never walks it, so the ref could rot without lat check ever
# noticing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - run: pnpm install --frozen-lockfile
      - run: pnpm buildall
      - run: pnpm vitest run --reporter=verbose

      - name: Verify the version is a fork version and matches the tag
        run: |
          VER=$(node -p "require('./package.json').version")
          case "$VER" in
            *-fork.*) ;;
            *) echo "Refusing to release $VER: not a -fork version." >&2; exit 1 ;;
          esac
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$VER" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v$VER." >&2
            exit 1
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Pack the CLI
        run: |
          mkdir -p release
          pnpm pack --pack-destination release
          # A second copy under a version-free name, so
          # /releases/latest/download/lat.md-latest.tgz is a URL that never
          # needs editing. GitHub's `latest` redirect resolves the release but
          # not the asset name, so a stable name has to exist as a real asset.
          cp "release/lat.md-${VER}.tgz" release/lat.md-latest.tgz
          ls -l release

      - name: Write the release notes
        run: |
          {
            echo "Fork build of lat.md."
            echo
            echo "Install the CLI:"
            echo
            echo '```'
            echo "npm i -g https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/lat.md-latest.tgz"
            echo '```'
            echo
            echo "Or pin this exact version:"
            echo
            echo '```'
            echo "npm i -g https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VER}/lat.md-${VER}.tgz"
            echo '```'
            echo
            echo "Install the Claude Code plugin (no build needed):"
            echo
            echo '```'
            echo "/plugin marketplace add ${GITHUB_REPOSITORY}"
            echo "/plugin install lat-md@lat-md"
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" release/*.tgz --clobber
          else
            gh release create "v$VER" release/*.tgz \
              --title "v$VER" \
              --notes-file release-notes.md
          fi
