# Generated by `lat gen github-wiki-workflow`.
#
# Before the first run, the wiki must be initialized once:
# enable Wikis in repository settings, open the Wiki tab, create and save the first page.

name: Publish Diataxis documentation to GitHub Wiki

on:
  push:
    branches: ['{{BRANCH}}']
    paths: ['lat.md/**']
  workflow_dispatch:

permissions: {}

concurrency:
  group: lat-wiki

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '{{NODE_VERSION}}'

      - run: npm install --global --ignore-scripts {{LAT_PACKAGE}}@{{LAT_VERSION}}

      - run: lat wiki build "${{ runner.temp }}/wiki" --repo ${{ github.repository }} --ref ${{ github.sha }}

      - uses: actions/upload-artifact@v7
        with:
          name: wiki
          path: ${{ runner.temp }}/wiki
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: wiki
          path: ${{ runner.temp }}/wiki

      - name: Publish to GitHub Wiki
        env:
          WIKI_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUNDLE_DIR="${{ runner.temp }}/wiki"
          CLONE_DIR="${{ runner.temp }}/wiki-clone"

          git clone "https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$CLONE_DIR"
          cd "$CLONE_DIR"

          find . -maxdepth 1 -type f -iname '*.md' -delete
          cp "$BUNDLE_DIR"/*.md .

          git config user.name "lat.md"
          git config user.email "lat@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git -c commit.gpgsign=false commit -m "Publish Diataxis documentation (${GITHUB_SHA::7})"
            git push origin HEAD
          fi
